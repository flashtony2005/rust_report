[package]
name = "rpx-runtime"
version = "0.1.0"
edition.workspace = true
[dependencies]
rpx-core = { path = "../rpx-core" }
rpx-engine = { path = "../rpx-engine" }
rpx-ds = { path = "../rpx-ds" }
rpx-export = { path = "../rpx-export" }
serde_json = "1"
sha2 = "0.10"
time = { version = "0.3", features = ["formatting"] }
json-patch = "4"
[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
calamine = "0.36"
zip = { version = "8.6", default-features = false, features = ["deflate-flate2"] }

[package]
name = "rpx-runtime"
version = "0.12.0"
edition.workspace = true
[features]
default = []
legacy-rpx = ["rpx-model/legacy-rpx", "rpx-format/legacy-rpx"]

[dependencies]
rpx-model = { path = "../rpx-model", default-features = false }
rpx-format = { path = "../rpx-format" }
rpx-engine = { path = "../rpx-engine" }
rpx-ds = { path = "../rpx-ds" }
rpx-export = { path = "../rpx-export" }
serde_json = "1"
sha2 = "0.10"
base64 = "0.22"
time = { version = "0.3", features = ["formatting"] }
json-patch = "4"
[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
calamine = "0.36"
zip = { version = "8.6", default-features = false, features = ["deflate-flate2"] }

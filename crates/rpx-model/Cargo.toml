[package]
name = "rpx-model"
version = "0.7.0"
edition.workspace = true
description = "ReportLite model types + optional .rpx binary reader/writer (pure std, zero dependencies)"

[features]
default = []
legacy-rpx = []

[lib]
name = "rpx_core"

[dependencies]

[[test]]
name = "golden"
path = "tests/golden.rs"
required-features = ["legacy-rpx"]

[[test]]
name = "robustness"
path = "tests/robustness.rs"
required-features = ["legacy-rpx"]

[[test]]
name = "roundtrip"
path = "tests/roundtrip.rs"
required-features = ["legacy-rpx"]

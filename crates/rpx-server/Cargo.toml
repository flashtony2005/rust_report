[package]
name = "rpx-server"
version = "0.14.0"
edition.workspace = true
[dependencies]
rpx-runtime = { path = "../rpx-runtime", default-features = false }
axum = "0.8"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util"] }
[dev-dependencies]
rpx-model = { path = "../rpx-model" }
rpx-engine = { path = "../rpx-engine" }
rpx-ds = { path = "../rpx-ds" }
rpx-export = { path = "../rpx-export" }
tokio = { version = "1", features = ["time"] }

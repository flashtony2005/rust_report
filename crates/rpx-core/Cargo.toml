[package]
name = "rpx-core"
version = "0.4.0"
edition.workspace = true
description = "ReportLite .rpx binary format parser (pure std, zero dependencies)"

[features]
default = ["legacy-rpx"]
legacy-rpx = []

[dependencies]

[[test]]
name = "golden"
path = "tests/golden.rs"
required-features = ["legacy-rpx"]

[[test]]
name = "robustness"
path = "tests/robustness.rs"
required-features = ["legacy-rpx"]

[[test]]
name = "roundtrip"
path = "tests/roundtrip.rs"
required-features = ["legacy-rpx"]

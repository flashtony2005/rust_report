[package]
name = "rpx-cli"
version = "0.12.0"
edition.workspace = true
[[bin]]
name = "rpx"
path = "src/main.rs"
[features]
default = []
legacy-rpx = ["rpx-runtime/legacy-rpx", "rpx-model/legacy-rpx"]

[dependencies]
rpx-runtime = { path = "../rpx-runtime", default-features = false }
rpx-model = { path = "../rpx-model", default-features = false }
clap = { version = "4", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

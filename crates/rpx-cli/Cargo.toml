[package]
name = "rpx-cli"
version = "0.1.0"
edition.workspace = true
[[bin]]
name = "rpx"
path = "src/main.rs"
[features]
default = ["legacy-rpx"]
legacy-rpx = ["rpx-runtime/legacy-rpx"]

[dependencies]
rpx-runtime = { path = "../rpx-runtime" }
rpx-core = { path = "../rpx-core" }
clap = { version = "4", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

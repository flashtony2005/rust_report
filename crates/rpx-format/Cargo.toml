[package]
name = "rpx-format"
version = "0.15.0"
edition.workspace = true
description = "JSON report definition parse/build (no binary RPX dependency)"

[features]
default = []
legacy-rpx = ["rpx-model/legacy-rpx"]

[dependencies]
rpx-model = { path = "../rpx-model", default-features = false }
rpx-engine = { path = "../rpx-engine" }
rpx-export = { path = "../rpx-export" }
serde_json = "1"

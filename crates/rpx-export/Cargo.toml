[package]
name = "rpx-export"
version = "0.15.0"
edition.workspace = true
description = "ReportLite export face (M6): calculated CalcGrid -> files; CSV first, xlsx next. Audited layer: rpx-model/rpx-engine stay zero-dependency."

[dependencies]
rpx-engine = { path = "../rpx-engine" }
# 受审层依赖：登记见 scripts/dep_allowlist.txt + docs/code-review.md §3.2
rust_xlsxwriter = "0.99"
base64 = "0.22"

[dev-dependencies]
# 读回自洽对拍用（不进产物，G5 不覆盖 dev-deps；见 spec-m6 §2.4）
calamine = "0.36"
# M6-05 导出基线：测试要 open 模板（rpx-export 本体只依赖 rpx-engine）
rpx-model = { path = "../rpx-model", features = ["legacy-rpx"] }
